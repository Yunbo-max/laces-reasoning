config_name: rwkv_relay_2.9B_chunked_birwkv_dynlowrank_r32_ctrl50k

# CONTROLLED fixed-vs-dynamic writer pair, chunked / biRWKV / 2.9B / 50k steps.
#
# This file is one arm of a matched pair. Its sibling is
#   rwkv_relay_2.9B_chunked_birwkv_<other>_r32_ctrl50k.yaml
# and the two differ in EXACTLY ONE substantive field: model.s1_writer_type.
# (config_name + logging.run_name also differ, forced: otherwise the two runs
# would overwrite each other's save dir. Neither affects the computation.)
#
# Provenance: every other field is copied verbatim from the archived reference
# recipe of the dynamic chunked arm,
#   /inspire/hdd/project/multimodal-diffusion-language-model/public/lalaland/training_config.yaml
# (config configs/rwkv_relay_2.9B_dynamic_basis_dynlowrank_r32.yaml, commit bf31311,
#  eval alias champ-dynamic-30k), with three path fixups forced by this filesystem
# and one diagnostic flag change, all applied IDENTICALLY to both arms:
#
#   1. data.token_dir -> absolute. The reference's relative
#      'preprocessed_data/owt_rwkv_tokens/train' does not exist under
#      laces-reasoning; the shards live in the DiffRwkv tree (304,052 .npz files).
#   2. model.rwkv_local_path -> absolute (same value the 50k global runs used).
#   3. training.resume -> absolute path to the champion warm start. The
#      reference says 'checkpoints/laces-champion', which does not exist on disk
#      anywhere and was a local-only symlink on the original author's machine.
#      RESOLVED to the checkpoint below; see logs/qz/CTRL50K_PAIR_LEDGER.md for
#      the bit-identity proof that this IS what the reference arm resumed from.
#   4. training.require_s1_writer_grad -> false (was true). The guard at
#      train_state_hijacking_dit.py:927 hard-raises unless
#      s1_writer_type == dynlowrank, so leaving it true would crash the fixed
#      arm on step 1. Set false in BOTH arms to keep the pair matched. The flag
#      is diagnostic only -- it does not enter the loss or touch any parameter.
#      Writer liveness is instead verified by checkpoint bit-diffs (see ledger).
#
# NOTE on the loss, verified arithmetically against the existing runs' logs:
# at stage 2 the ONLY live terms are diff_loss and 0.5*s2_coadapt_ce_loss.
# kl_weight/free_bits/text_loss_weight below are INERT at this stage -- the KL
# branch is gated on `train_stage in (0, 3)` (train_state_hijacking_dit.py:901)
# and the stage-2 loss expression contains no ce term. They are kept at the
# reference values anyway, because changing them would deviate from the recipe
# and they are inert identically in both arms. Check: the fixed global run logged
# loss=1.3193 diff=0.0250 coadapt_ce=2.5885 -> 0.0250 + 0.5*2.5885 = 1.31925. Exact.

data:
  use_preprocessed: true
  token_dir: /inspire/hdd/global_user/zhangjiaquan-253108540222/research/DiffRwkv/preprocessed_data/owt_rwkv_tokens/train
  latent_dir: null
  max_length: 512
  num_workers: 0
  max_samples: null
  use_external_latents: false

model:
  type: rwkv_state_hijack_dit
  rwkv_name: RWKV/RWKV7-Goose-World3-2.9B-HF
  rwkv_local_path: /inspire/hdd/global_user/zhangjiaquan-253108540222/research/laces-reasoning/models/RWKV7-Goose-World3-2.9B-HF-fla-v2
  rwkv_trust_remote_code: true
  add_mask_token: false
  pad_token_strategy: eos
  encoder_type: variational
  latent_dim: 32
  n_basis: 16
  # ─────────────────────────────────────────────────────────────────────────
  # THE CONTROLLED VARIABLE. This is the only substantive line that differs
  # between the two arms of the pair.
  s1_writer_type: dynlowrank
  # ─────────────────────────────────────────────────────────────────────────
  # Kept in BOTH arms even though they are read only inside the dynlowrank
  # branch (models/state_hijacking_dit.py:869-879), so the diff stays at one line.
  s1_rank: 32
  s1_dyn_hidden: 128
  dit_hidden: 768
  dit_depth: 8
  dit_num_heads: 4
  trajectory_state_hidden: 256
  trajectory_state_depth: 4
  trajectory_state_num_heads: 4
  dit_num_tokens: 4
  # chunked trajectory geometry, biRWKV denoiser (NOT DiT)
  trajectory_mode: true
  trajectory_chunk_size: 32
  trajectory_horizon: 16
  trajectory_denoiser_type: birwkv
  trajectory_state_decoder_type: dit
  # 'independent' => trajectory_state_decoder is None => predict_trajectory_states
  # falls through to predict_states, which routes on s1_writer_type. This is what
  # makes the controlled variable actually reach the state-writing path.
  trajectory_s1_mode: independent
  trajectory_state_blend: 0.7
  use_cond_boundary: true

training:
  seed: 42
  num_epochs: 50
  num_train_steps: 50000
  train_batch_size: 4
  eval_batch_size: 1
  dtype: bf16
  lr_schedule: cosine
  warmup_steps: 500
  resume: /inspire/hdd/global_user/zhangjiaquan-253108540222/research/DiffRwkv/outputs_relay/traj32x16-2.9B-singlez-bridge-v2-s2-birwkv-joint-scratch/step_00026000
  world_size: 1
  save_every_n_steps: 10000
  stage: 2
  gen_type: ddpm
  trajectory_condition_first: false
  s1_self_forcing: false
  self_forcing_prob: 0.5
  self_forcing_prob_warmup: 1000
  self_forcing_bptt_chunks: 1
  prefix_suffix_trajectory_s2: true
  cfg_drop_prob: 0.1
  prefix_suffix_min_prefix: 32
  prefix_suffix_min_suffix: 32
  s2_unfreeze_s1: true
  s2_unfreeze_s0: false
  s2_coadapt_ce_checkpoint: true
  require_s1_writer_grad: false

logging:
  run_name: laces-2.9B-ctrl50k-dynlowrank-chunked-birwkv-b4
  wandb_project: laces-dynamic-basis
  wandb_dir: ./outputs/
  log_freq: 10
  save_freq: 10000
  save_dir: ./outputs_ctrl50k

loss:
  text_loss_weight: 1.0
  diff_loss_weight: 1.0
  trajectory_delta_loss_weight: 0.0
  kl_weight: 0.05
  kl_warmup_steps: 2000
  free_bits: 0.1
  s2_coadapt_ce_loss_weight: 0.5

optimizer:
  name: adamw
  lr: 1.0e-04
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  grad_clip_norm: 1.0

tokenizer:
  cache_dir: ./data/huggingface
  local_files_only: true

hydra:
  job:
    chdir: false
