config_name: rwkv_relay_13.3B_dynamic_basis_dynlowrank_r32_chunked_birwkv

# 13.3B scale-up of the dynamic-basis (dynlowrank rank-32) chunked recipe.
#
# Mirror of configs/rwkv_relay_2.9B_dynamic_basis_dynlowrank_r32.yaml with:
#   - backbone  : RWKV7-G1f-13.3B (61 layers / 4096 hidden / 64 heads x 64)
#   - S2 denoiser: BiRWKV (trajectory_denoiser_type: birwkv), 768x8 = ~91M
#   - S0        : reused from outputs_relay/traj32x16-13.3B-s0/step_00050000
#                 (512 geometry, stage-3 run, 50k steps) -- S1+S2 are trained here.
#
# Backbone dims are read from the checkpoint config, so num_layers/num_heads are
# not set explicitly.

data:
  use_preprocessed: true
  token_dir: /inspire/hdd/global_user/zhangjiaquan-253108540222/research/DiffRwkv/preprocessed_data/owt_rwkv_tokens/train
  latent_dir: null
  max_length: 512
  num_workers: 4
  max_samples: null
  use_external_latents: false

model:
  type: rwkv_state_hijack_dit
  rwkv_name: BlinkDL/rwkv7-g1
  rwkv_local_path: /inspire/hdd/global_user/zhangjiaquan-253108540222/models/RWKV7-G1f-13.3B-HF
  rwkv_trust_remote_code: true
  add_mask_token: false
  pad_token_strategy: eos
  encoder_type: variational
  latent_dim: 32
  n_basis: 32
  # --- dynamic basis writer ---
  s1_writer_type: dynlowrank
  s1_rank: 32
  s1_dyn_hidden: 128
  # --- S2 denoiser: BiRWKV over the latent trajectory ---
  dit_hidden: 768
  dit_depth: 8
  dit_num_heads: 4
  dit_num_tokens: 4
  trajectory_state_hidden: 256
  trajectory_state_depth: 4
  trajectory_state_num_heads: 4
  trajectory_mode: true
  trajectory_chunk_size: 32
  trajectory_horizon: 16
  trajectory_denoiser_type: birwkv
  trajectory_state_decoder_type: dit
  trajectory_s1_mode: independent
  trajectory_state_blend: 0.7
  use_cond_boundary: true

training:
  seed: 42
  num_epochs: 50
  num_train_steps: 50000
  train_batch_size: 4          # per GPU; x8 GPUs = global 32, matching the 2.9B recipe
  eval_batch_size: 1
  dtype: bf16
  lr_schedule: cosine
  warmup_steps: 500
  resume: null                 # set on the command line (the 13.3B S0)
  world_size: 1
  save_every_n_steps: 5000
  # Joint recipe, same as the 2.9B dynamic-basis run: train S1 and S2 together
  # from the pretrained S0, rather than running an S1 stage then an S2 stage.
  stage: 2
  gen_type: ddpm
  trajectory_condition_first: false
  s1_self_forcing: false
  self_forcing_prob: 0.5
  self_forcing_prob_warmup: 1000
  self_forcing_bptt_chunks: 1
  prefix_suffix_trajectory_s2: true
  cfg_drop_prob: 0.1
  prefix_suffix_min_prefix: 32
  prefix_suffix_min_suffix: 32
  s2_unfreeze_s1: true
  s2_unfreeze_s0: false
  s2_coadapt_ce_checkpoint: true
  require_s1_writer_grad: true

logging:
  run_name: laces-13.3B-dynlowrank-r32-chunked-birwkv-50k
  wandb_project: laces-dynamic-basis
  wandb_dir: ./outputs/
  log_freq: 10
  save_freq: 5000
  save_dir: ./outputs_dynamic_basis

loss:
  text_loss_weight: 1.0
  diff_loss_weight: 1.0
  trajectory_delta_loss_weight: 0.0
  kl_weight: 0.05
  kl_warmup_steps: 2000
  free_bits: 0.1
  s2_coadapt_ce_loss_weight: 0.5

optimizer:
  name: adamw
  lr: 1.0e-04
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  grad_clip_norm: 1.0

tokenizer:
  cache_dir: ./data/huggingface
  local_files_only: true

hydra:
  job:
    chdir: false
