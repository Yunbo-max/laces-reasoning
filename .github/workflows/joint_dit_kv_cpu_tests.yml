name: Joint DiT KV CPU contracts

on:
  push:
    branches:
      - research/joint-dit-kv-latentmas
    paths:
      - "experiments/joint_dit_kv/**"
      - ".github/workflows/joint_dit_kv_cpu_tests.yml"
  workflow_dispatch:

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.57.1" pytest
      - name: Run mechanism and tiny random Qwen2 tests
        run: |
          python -m pytest -q experiments/joint_dit_kv/tests/test_contracts.py
